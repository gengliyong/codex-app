<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex App</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Codex App</h1>
      <p class="hint">零依赖 Node.js 项目，已经跑起来了。</p>

      <div class="status" id="status" data-state="pending">
        <span class="dot"></span>
        <span id="status-text">正在检查 /api/health …</span>
      </div>

      <button id="refresh" type="button">重新检查</button>

      <dl class="details">
        <dt>Node</dt>
        <dd id="node">-</dd>
        <dt>运行时长</dt>
        <dd id="uptime">-</dd>
        <dt>服务器时间</dt>
        <dd id="time">-</dd>
      </dl>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
